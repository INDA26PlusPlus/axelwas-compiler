<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        textarea {
            width: 800px;
            height: 800px;
        }
    </style>
</head>
<body>
    <script type="module">
        import { compile } from "/script.js";

        function escapeHtml(str) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return str.replace(/[&<>"']/g, (m) => map[m]);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("compile")?.addEventListener("mousedown", () => {
                const textarea = document.getElementById("code");

                if (textarea instanceof HTMLTextAreaElement) {
                    const result = compile(textarea.value);

                    const toAdd = `
                        <h1>Compiled program to QBE IL</h1>
                        <pre style="padding: 12px; border: 1px solid black;">${escapeHtml(result)}</pre>
                    `;

                    document.getElementById("result").innerHTML = toAdd;
                }
            });
        });
    </script>
    <textarea id="code">
]=$100zero
]=$101one
]=$102one
]=$103twenty

^w ~!~=$103zero
]=$100~+$101$102
]=$101$102
]=$102$100
]=$103~-$103one
]p$100
^d 
</textarea>
<button id="compile">Compile!</button>
<div id="result"></div>
</body>
</html>
